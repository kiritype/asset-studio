<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    // Theme before the first paint; the server setting replaces it once loaded.
    (() => {
      let theme = 'system';
      try { theme = localStorage.getItem('asset-studio-theme') || 'system'; } catch {}
      const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
  <title>Asset Studio</title>
  <link rel="stylesheet" href="/css/studio.css">
  <link rel="stylesheet" href="/css/prompts.css">
  <link rel="stylesheet" href="/css/jobs.css">
  <link rel="stylesheet" href="/css/gallery.css">
  <link rel="stylesheet" href="/css/settings.css">
  <link rel="stylesheet" href="/css/lab.css">
  <link rel="stylesheet" href="/css/tools.css">
  <link rel="stylesheet" href="/css/lora.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="studio-header">
    <a class="studio-brand" href="/jobs" data-route>
      <span class="brand-icon">✦</span>
      <span>Asset Studio<small>LOCAL IMAGE WORKSPACE</small></span>
    </a>
    <nav aria-label="Main menu" data-i18n-label="app.main_menu">
      <a href="/prompts" data-route data-i18n="app.prompts">Prompts</a>
      <a href="/jobs" data-route data-i18n="common.jobs">Jobs</a>
      <a href="/lab" data-route data-i18n="common.lab">Lab</a>
      <a href="/tools" data-route data-i18n="common.image_tools">Image tools</a>
      <a href="/lora" data-route>LoRA</a>
      <a href="/gallery" data-route data-i18n="common.gallery">Gallery</a>
      <a href="/settings" data-route data-i18n="common.settings">Settings</a>
    </nav>
    <div class="studio-global">
      <button id="runtime-status" type="button" title="ComfyUI connection" data-i18n-title="app.comfyui_connection">
        <span class="runtime-dot"></span><span id="runtime-label" data-i18n="app.checking_connection">Checking connection</span>
      </button>
      <button id="queue-open" type="button"><span data-i18n="app.queue">Queue</span> <span id="global-queue-count">—</span></button>
    </div>
  </header>

  <div id="preview-banner" class="preview-banner" hidden data-i18n="app.preview_this_server_shows_a_copy">
    Preview · this server shows a copy for checking. The generation queue and ComfyUI control are off.</div>
  <div id="studio-toast" role="status" aria-live="polite" hidden></div>
  <main id="studio-content"></main>

  <dialog id="queue-drawer" aria-labelledby="queue-title">
    <header>
      <div>
        <small>GENERATION QUEUE</small>
        <h2 id="queue-title" data-i18n="app.job_queue">Job queue</h2>
      </div>
      <button id="queue-close" type="button" aria-label="Close queue" data-i18n-label="app.close_queue">×</button>
    </header>
    <p id="queue-state"></p>
    <div id="queue-actions" class="queue-actions"></div>
    <div id="queue-rows"></div>
  </dialog>
</body>
</html>
